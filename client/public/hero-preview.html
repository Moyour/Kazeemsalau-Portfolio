<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Preview - Kazeem Salau</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 25%, #ec4899 50%, #f59e0b 100%);
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
        }
        
        .hero-content {
            position: absolute;
            left: 0;
            top: 0;
            width: 60%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 60px;
            z-index: 2;
        }
        
        .hero-text {
            color: white;
        }
        
        .main-heading {
            font-size: 72px;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #ffffff, #f3f4f6, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 24px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 16px;
            letter-spacing: 0.025em;
        }
        
        .description {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 500px;
        }
        
        .cta-button {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .hero-image {
            position: absolute;
            right: 0;
            top: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .profile-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
        }
        
        .particle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 60%; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 30%; left: 80%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 70%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(5) { top: 40%; left: 50%; animation-delay: 1.5s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .website-url {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: white;
            font-size: 14px;
            opacity: 0.7;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="floating-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="hero-content">
        <div class="hero-text">
            <h1 class="main-heading">
                FOR<br />
                <span class="gradient-text">LEARNING</span><br />
                DESIGN
            </h1>
            <div class="subtitle">Kazeem Salau</div>
            <p class="description">
                Learning Experience Designer, Instructional Designer, Web Application Developer, UI/UX Designer
            </p>
            <a href="#" class="cta-button">View Portfolio</a>
        </div>
    </div>
    
    <div class="hero-image">
        <div class="profile-circle">KS</div>
    </div>
    
    <div class="website-url">www.kazeemsalau.com</div>
</body>
</html>
