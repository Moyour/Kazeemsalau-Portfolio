<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Preview Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 25%, #ec4899 50%, #f59e0b 100%);
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-content {
            text-align: center;
            color: white;
            z-index: 2;
            max-width: 800px;
            padding: 40px;
        }
        
        .hero-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #ffffff, #f3f4f6, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        
        .description {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .website-url {
            position: absolute;
            bottom: 30px;
            right: 40px;
            color: white;
            font-size: 16px;
            opacity: 0.7;
            font-weight: 500;
        }
        
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }
        
        .circle-1 {
            width: 100px;
            height: 100px;
            top: 15%;
            left: 8%;
            animation-delay: 0s;
        }
        
        .circle-2 {
            width: 140px;
            height: 140px;
            top: 55%;
            right: 12%;
            animation-delay: 2s;
        }
        
        .circle-3 {
            width: 80px;
            height: 80px;
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
    </div>
    
    <div class="preview-content">
        <h1 class="hero-title">
            FOR<br />
            <span class="gradient-text">LEARNING</span><br />
            DESIGN
        </h1>
        <div class="subtitle">Kazeem Salau</div>
        <p class="description">
            Learning Experience Designer, Instructional Designer, Web Application Developer, UI/UX Designer
        </p>
    </div>
    
    <div class="website-url">www.kazeemsalau.com</div>
</body>
</html>
