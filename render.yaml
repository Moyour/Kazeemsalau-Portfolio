services:
  - type: web
    name: kazeem-portfolio-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health

  - type: web
    name: kazeem-portfolio-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production

databases:
  - name: kazeem-portfolio-db
    plan: starter
    databaseName: kazeem_portfolio
    user: kazeem_user


